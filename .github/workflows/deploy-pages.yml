name: Build and publish branded feeds
run-name: "Feed build ${{ inputs.project || github.event.client_payload.project || 'all-projects' }} [${{ inputs.request_id || github.event.client_payload.request_id || github.run_id }}]"

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project slug; empty rebuilds every active project
        required: false
        type: string
        default: ""
      render_ids:
        description: Comma-separated lot ids, changed, or all
        required: false
        type: string
        default: ""
      request_id:
        description: Correlation id for a Feed Studio manual refresh
        required: false
        type: string
        default: ""
  repository_dispatch:
    types: [profitbase-refresh]
  schedule:
    - cron: "0 0,13 * * *"
      timezone: "Europe/Moscow"
  workflow_call:
    inputs:
      project:
        description: Project slug; empty rebuilds every active project
        required: false
        type: string
        default: ""
      render_ids:
        description: Comma-separated lot ids or all
        required: false
        type: string
        default: ""
      request_id:
        description: Correlation id for a Feed Studio manual refresh
        required: false
        type: string
        default: ""
  push:
    paths:
      - "assets/**"
      - "projects/*/assets/**"
      - "!projects/*/assets/uploads/**"

permissions:
  contents: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Checkout current published data
        uses: actions/checkout@v7
        with:
          ref: feed-data
          path: .feed-data

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install renderer
        run: npm install --no-audit --no-fund

      - name: Cache Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}

      - name: Restore rendered card cache
        uses: actions/cache@v5
        with:
          path: render-cache
          key: ${{ runner.os }}-rendered-cards-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-rendered-cards-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Seed unchanged rendered cards
        env:
          PUBLISHED_DATA_DIR: .feed-data/published
          RENDER_CACHE_DIR: render-cache
          CURRENT_PAGES_ROOT: https://indigo-feed-studio-upload.indigo-dm-tech.workers.dev/media
        run: python src/seed_render_cache.py

      - name: Prepare current site snapshot
        env:
          FEED_STUDIO_PASSWORD_HASH: ${{ secrets.FEED_STUDIO_PASSWORD_HASH }}
          PUBLISHED_DATA_DIR: .feed-data/published
          RENDER_CACHE_DIR: render-cache
        run: |
          python src/prepare_site.py
          python src/seed_site.py

      - name: Build and validate affected project cards
        env:
          PROJECT_SLUG: ${{ inputs.project || github.event.client_payload.project || '' }}
          RENDER_IDS: ${{ inputs.render_ids || github.event.client_payload.render_ids || (github.event_name == 'schedule' && 'changed') || '' }}
          RENDER_CACHE_DIR: render-cache
          PUBLISHED_DATA_DIR: .feed-data/published
          SITE_PREPARED: "1"
          PROFITBASE_FEED_URL: ${{ secrets.PROFITBASE_FEED_URL }}
          PROFITBASE_FEEDS_JSON: ${{ secrets.PROFITBASE_FEEDS_JSON }}
          FEED_STUDIO_PASSWORD_HASH: ${{ secrets.FEED_STUDIO_PASSWORD_HASH }}
          FEED_STUDIO_UPLOAD_URL: ${{ vars.FEED_STUDIO_UPLOAD_URL }}
          FEED_ASSET_PUBLIC_ROOT: https://indigo-feed-studio-upload.indigo-dm-tech.workers.dev/media
        run: python src/build_all.py

      - name: Update generated data branch
        env:
          PROJECT_SLUG: ${{ inputs.project || github.event.client_payload.project || '' }}
        run: |
          args=(--source site --destination .feed-data/published)
          if [ -n "$PROJECT_SLUG" ]; then args+=(--project "$PROJECT_SLUG"); fi
          python src/sync_fast_data.py "${args[@]}"
          git -C .feed-data config user.name "github-actions[bot]"
          git -C .feed-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .feed-data add published
          if git -C .feed-data diff --cached --quiet; then
            echo "Generated feed data is already current."
          else
            git -C .feed-data commit -m "Publish generated feed data"
            git -C .feed-data push origin feed-data
          fi

      - name: Publish changed project files to Cloudflare R2
        env:
          PROJECT_SLUG: ${{ inputs.project || github.event.client_payload.project || '' }}
          CLOUDFLARE_ACCOUNT_ID: a9cba5f7aab40d0c2af7d11c14d59811
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: indigo-feed-studio
        run: |
          aws --version
          args=(--source site)
          if [ -n "$PROJECT_SLUG" ]; then args+=(--project "$PROJECT_SLUG"); fi
          python src/publish_r2.py "${args[@]}"
