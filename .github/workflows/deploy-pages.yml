name: Build and publish branded feeds
run-name: "Feed build ${{ inputs.project || github.event.client_payload.project || 'all-projects' }} [${{ inputs.request_id || github.event.client_payload.request_id || github.run_id }}]"

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project slug; empty rebuilds every active project
        required: false
        type: string
        default: ""
      render_ids:
        description: Comma-separated lot ids, changed, or all
        required: false
        type: string
        default: ""
      request_id:
        description: Correlation id for a Feed Studio manual refresh
        required: false
        type: string
        default: ""
      finalize:
        description: Update the shared snapshot and public registry
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      project:
        description: Exact project slug
        required: true
        type: string
      render_ids:
        description: Comma-separated lot ids or all
        required: false
        type: string
        default: ""
      request_id:
        description: Correlation id for a Feed Studio manual refresh
        required: false
        type: string
        default: ""
      finalize:
        description: Update the shared snapshot and public registry
        required: false
        type: boolean
        default: true
permissions:
  contents: read
  actions: write

concurrency:
  group: pages-${{ inputs.project || github.event.client_payload.project || 'explicit-all-projects' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install renderer
        run: npm install --no-audit --no-fund

      - name: Cache Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}

      - name: Restore rendered card cache
        uses: actions/cache@v5
        with:
          path: ${{ (inputs.project || github.event.client_payload.project) && format('render-cache/{0}', inputs.project || github.event.client_payload.project) || 'render-cache' }}
          key: ${{ runner.os }}-rendered-cards-${{ inputs.project || github.event.client_payload.project || 'all-projects' }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-rendered-cards-${{ inputs.project || github.event.client_payload.project || 'all-projects' }}-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Load current published state from R2
        env:
          PROJECT_SLUG: ${{ inputs.project || github.event.client_payload.project || '' }}
          CLOUDFLARE_ACCOUNT_ID: a9cba5f7aab40d0c2af7d11c14d59811
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: indigo-feed-studio
        run: |
          mkdir -p .published/projects
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "s3://${R2_BUCKET}/published/projects.json" .published/projects.json \
            --endpoint-url "$endpoint" --only-show-errors
          if [ -n "$PROJECT_SLUG" ]; then
            mkdir -p ".published/projects/${PROJECT_SLUG}"
            aws s3 sync "s3://${R2_BUCKET}/published/projects/${PROJECT_SLUG}" ".published/projects/${PROJECT_SLUG}" \
              --exclude "*" --include "*.json" --include "*.xml" \
              --endpoint-url "$endpoint" --only-show-errors --no-progress
          else
            aws s3 sync "s3://${R2_BUCKET}/published/projects" .published/projects \
              --exclude "*" --include "*.json" --include "*.xml" \
              --endpoint-url "$endpoint" --only-show-errors --no-progress
          fi

      - name: Seed unchanged rendered cards
        env:
          PROJECT_SLUG: ${{ inputs.project || github.event.client_payload.project || '' }}
          PUBLISHED_DATA_DIR: .published
          RENDER_CACHE_DIR: render-cache
          CURRENT_PAGES_ROOT: https://feed-api.indigo-dm.ru/media
        run: python src/seed_render_cache.py

      - name: Prepare current site snapshot
        env:
          FEED_STUDIO_PASSWORD_HASH: ${{ secrets.FEED_STUDIO_PASSWORD_HASH }}
          PUBLISHED_DATA_DIR: .published
          RENDER_CACHE_DIR: render-cache
        run: |
          python src/prepare_site.py
          python src/seed_site.py

      - name: Load protected Profitbase source addresses
        env:
          CLOUDFLARE_ACCOUNT_ID: a9cba5f7aab40d0c2af7d11c14d59811
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PROFITBASE_FEEDS_JSON: ${{ secrets.PROFITBASE_FEEDS_JSON }}
        run: |
          mkdir -p .source-feeds
          aws s3 sync s3://indigo-feed-studio/private/source-feeds .source-feeds --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" --only-show-errors
          python src/prepare_source_feeds.py --source .source-feeds

      - name: Build and validate affected project cards
        env:
          PROJECT_SLUG: ${{ inputs.project || github.event.client_payload.project || '' }}
          RENDER_IDS: ${{ inputs.render_ids || github.event.client_payload.render_ids || (github.event_name == 'schedule' && 'changed') || '' }}
          RENDER_CACHE_DIR: render-cache
          PUBLISHED_DATA_DIR: .published
          SITE_PREPARED: "1"
          PROFITBASE_FEED_URL: ${{ secrets.PROFITBASE_FEED_URL }}
          FEED_STUDIO_PASSWORD_HASH: ${{ secrets.FEED_STUDIO_PASSWORD_HASH }}
          FEED_STUDIO_UPLOAD_URL: https://feed-api.indigo-dm.ru
          FEED_ASSET_PUBLIC_ROOT: https://feed-api.indigo-dm.ru/media
          FEED_MEDIA_PUBLIC_ROOT: https://indigo-feed-studio-gateway.pages.dev/media
        run: python src/build_all.py

      - name: Publish changed project files to Cloudflare R2
        env:
          PROJECT_SLUG: ${{ inputs.project || github.event.client_payload.project || '' }}
          CLOUDFLARE_ACCOUNT_ID: a9cba5f7aab40d0c2af7d11c14d59811
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: indigo-feed-studio
          FINALIZE: ${{ inputs.finalize }}
        run: |
          aws --version
          args=(--source site)
          if [ -n "$PROJECT_SLUG" ]; then args+=(--project "$PROJECT_SLUG"); fi
          if [ "$FINALIZE" != "true" ]; then args+=(--skip-registry); fi
          python src/publish_r2.py "${args[@]}"

      - name: Preserve project data for registry finalization
        if: ${{ !inputs.finalize }}
        uses: actions/upload-artifact@v6
        with:
          name: feed-project-${{ inputs.project }}
          path: |
            site/projects/${{ inputs.project }}/inventory.json
            site/projects/${{ inputs.project }}/settings.json
            site/projects/${{ inputs.project }}/status.json
            site/projects/${{ inputs.project }}/assets.json
            site/projects/${{ inputs.project }}/source-profitbase.xml
            site/projects/${{ inputs.project }}/avito.xml
            site/projects/${{ inputs.project }}/pilot-avito.xml
          retention-days: 1
          if-no-files-found: error

      # actions/cache saves the current run's immutable cache in its post-job
      # hook. Keep one previous generation now; after the post-job save there
      # will be at most two rendered-card caches available for rollback/reuse.
      - name: Remove obsolete rendered card caches
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          CACHE_SCOPE: ${{ inputs.project || github.event.client_payload.project || 'all-projects' }}
        with:
          script: |
            const prefix = `${process.env.RUNNER_OS}-rendered-cards-${process.env.CACHE_SCOPE}-`;
            const caches = [];
            for (let page = 1; ; page += 1) {
              const { data } = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page
              });
              caches.push(...data.actions_caches);
              if (data.actions_caches.length < 100) break;
            }
            const obsolete = caches
              .filter((cache) => cache.key.startsWith(prefix))
              .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at))
              .slice(1);
            for (const cache of obsolete) {
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id
              });
            }
            core.info(`Deleted ${obsolete.length} obsolete rendered-card caches.`);
