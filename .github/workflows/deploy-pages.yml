name: Build and deploy pilot feed

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project slug; empty rebuilds every active project
        required: false
        type: string
        default: ""
      render_ids:
        description: Comma-separated lot ids, changed, or all
        required: false
        type: string
        default: ""
  schedule:
    - cron: "27 * * * *"
      timezone: "Europe/Moscow"
  workflow_call:
    inputs:
      project:
        description: Project slug; empty rebuilds every active project
        required: false
        type: string
        default: ""
      render_ids:
        description: Comma-separated lot ids or all
        required: false
        type: string
        default: ""
  push:
    paths:
      - "assets/**"
      - "src/build_all.py"
      - "src/build_pilot.py"
      - "src/render_pilot.cjs"
      - "src/validate_pilot.py"
      - "projects/*/assets/**"
      - "!projects/*/assets/uploads/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Checkout current published data
        uses: actions/checkout@v7
        with:
          ref: feed-data
          path: .feed-data

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install renderer
        run: npm install --no-audit --no-fund

      - name: Cache Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}

      - name: Restore rendered card cache
        uses: actions/cache@v5
        with:
          path: render-cache
          key: ${{ runner.os }}-rendered-cards-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-rendered-cards-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Seed unchanged rendered cards
        env:
          PUBLISHED_DATA_DIR: .feed-data/published
          RENDER_CACHE_DIR: render-cache
          CURRENT_PAGES_ROOT: https://indigo-dm.github.io/novyy-gorizont-feed
        run: python src/seed_render_cache.py

      - name: Prepare current site snapshot
        env:
          FEED_STUDIO_PASSWORD_HASH: ${{ secrets.FEED_STUDIO_PASSWORD_HASH }}
          PUBLISHED_DATA_DIR: .feed-data/published
          RENDER_CACHE_DIR: render-cache
        run: |
          python src/prepare_site.py
          python src/seed_site.py

      - name: Build and validate affected project cards
        env:
          PROJECT_SLUG: ${{ inputs.project }}
          RENDER_IDS: ${{ inputs.render_ids || (github.event_name == 'schedule' && 'changed') || '' }}
          RENDER_CACHE_DIR: render-cache
          PUBLISHED_DATA_DIR: .feed-data/published
          SITE_PREPARED: "1"
          PROFITBASE_FEED_URL: ${{ secrets.PROFITBASE_FEED_URL }}
          PROFITBASE_FEEDS_JSON: ${{ secrets.PROFITBASE_FEEDS_JSON }}
          FEED_STUDIO_PASSWORD_HASH: ${{ secrets.FEED_STUDIO_PASSWORD_HASH }}
          FEED_STUDIO_UPLOAD_URL: ${{ vars.FEED_STUDIO_UPLOAD_URL }}
        run: python src/build_all.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish-data:
    needs: build
    uses: ./.github/workflows/build-fast-data.yml
    with:
      project: ${{ inputs.project }}
    secrets: inherit
