name: Refresh fast feed data
run-name: "Fast feed refresh ${{ inputs.project || github.event.client_payload.project || 'all-projects' }} ${{ github.event.client_payload.window_id || '' }}"

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project slug; leave empty to refresh all projects
        required: false
        type: string
        default: ""
  repository_dispatch:
    types: [profitbase-refresh, scheduled-profitbase-refresh]
  schedule:
    # Reserve trigger, 30 minutes after the primary Cloudflare cron.
    # GitHub Actions cron is evaluated in UTC. Moscow is UTC+3 year-round.
    - cron: "47 10,21 * * *"

permissions:
  contents: write
  actions: write

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.fallback.outputs.should_run }}
      target_window: ${{ steps.fallback.outputs.target_window }}
    steps:
      - name: Checkout fallback decision code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Decide whether the reserve trigger is needed
        id: fallback
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: refresh-fast-data.yml
        run: python src/scheduled_fallback.py

  refresh:
    needs: decide
    if: ${{ needs.decide.outputs.should_run == 'true' }}
    uses: ./.github/workflows/build-fast-data.yml
    with:
      project: ${{ inputs.project || github.event.client_payload.project || '' }}
    secrets: inherit
