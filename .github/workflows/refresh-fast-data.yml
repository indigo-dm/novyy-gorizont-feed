name: Refresh fast feed data
run-name: "Fast feed refresh ${{ inputs.project || github.event.client_payload.project || 'all-projects' }}"

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project slug; leave empty to refresh all projects
        required: false
        type: string
        default: ""
  repository_dispatch:
    types: [profitbase-refresh]
  schedule:
    # GitHub Actions cron is evaluated in UTC. Moscow is UTC+3 year-round.
    - cron: "0 10,21 * * *"

permissions:
  contents: write

jobs:
  refresh:
    uses: ./.github/workflows/build-fast-data.yml
    with:
      project: ${{ inputs.project || github.event.client_payload.project || '' }}
    secrets: inherit
