name: Add Feed Studio project

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  actions: read

jobs:
  apply:
    if: github.actor == github.repository_owner && startsWith(github.event.issue.title, '[feed-project]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate and create project
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python src/apply_project_request.py

      - name: Commit project
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.json projects/
          git commit -m "Create Feed Studio project from issue #${ISSUE_NUMBER}"
          git push origin main

  deploy:
    needs: apply
    uses: ./.github/workflows/deploy-pages.yml
    secrets: inherit

  complete:
    needs: [apply, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm and close request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Объект создан в Feed Studio. Добавьте материалы и настройте закрытую ссылку Profitbase, затем объект можно активировать."
          gh issue close "$ISSUE_NUMBER"

  report-failure:
    if: failure() && github.actor == github.repository_owner && startsWith(github.event.issue.title, '[feed-project]')
    needs: [apply, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Report failure
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Объект не создан: автоматическая проверка завершилась ошибкой."
