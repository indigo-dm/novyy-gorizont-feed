name: Build safe feed data

on:
  workflow_call:
    inputs:
      project:
        description: Project slug; empty rebuilds every active project
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      project:
        description: Project slug; leave empty to rebuild all projects
        required: false
        type: string
        default: ""
permissions:
  contents: write
  actions: write

concurrency:
  group: feed-data
  cancel-in-progress: false

jobs:
  build:
    # Keep the reusable workflow entry point for existing callers, but route it
    # through the incremental renderer. Cached cards are reused; changed, new,
    # or remotely missing cards are rendered and validated before XML is
    # published. This prevents data-only refreshes from creating dead media URLs.
    uses: ./.github/workflows/deploy-pages.yml
    with:
      project: ${{ inputs.project }}
      render_ids: changed
    secrets: inherit
