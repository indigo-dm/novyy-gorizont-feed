name: Build safe feed data

on:
  workflow_call:
    inputs:
      project:
        description: Project slug; empty rebuilds every configured project
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      project:
        description: Project slug; leave empty to rebuild all projects
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: feed-data
  cancel-in-progress: false

jobs:
  build-one:
    if: ${{ inputs.project != '' }}
    uses: ./.github/workflows/deploy-pages.yml
    with:
      project: ${{ inputs.project }}
      render_ids: changed
      finalize: true
    secrets: inherit

  prepare-matrix:
    if: ${{ inputs.project == '' }}
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Select configured projects
        id: projects
        shell: bash
        run: echo "projects=$(python src/project_matrix.py)" >> "$GITHUB_OUTPUT"

  build-projects:
    if: ${{ inputs.project == '' }}
    needs: prepare-matrix
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        project: ${{ fromJSON(needs.prepare-matrix.outputs.projects) }}
    uses: ./.github/workflows/deploy-pages.yml
    with:
      project: ${{ matrix.project }}
      render_ids: changed
      finalize: false
    secrets: inherit

  finalize-all:
    if: ${{ inputs.project == '' && needs.build-projects.result == 'success' }}
    needs: build-projects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Checkout current published data
        uses: actions/checkout@v7
        with:
          ref: feed-data
          path: .feed-data

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download independently built projects
        uses: actions/download-artifact@v7
        with:
          pattern: feed-project-*
          path: staged/artifacts

      - name: Assemble the public registry
        run: >-
          python src/finalize_project_registry.py
          --source staged
          --published .feed-data/published
          --registry projects.json

      - name: Update generated data snapshot once
        run: |
          python src/sync_fast_data.py --source staged --destination .feed-data/published
          git -C .feed-data config user.name "github-actions[bot]"
          git -C .feed-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .feed-data add published
          if git -C .feed-data diff --cached --quiet; then
            echo "Generated feed data is already current."
          else
            git -C .feed-data commit -m "Publish generated feed data"
            git -C .feed-data push origin feed-data
          fi

      - name: Publish the completed registry to Cloudflare R2
        env:
          CLOUDFLARE_ACCOUNT_ID: a9cba5f7aab40d0c2af7d11c14d59811
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: indigo-feed-studio
        run: python src/publish_r2.py --source staged --registry-only
