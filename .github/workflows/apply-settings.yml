name: Apply feed settings

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  actions: read

jobs:
  apply:
    if: github.actor == github.repository_owner && startsWith(github.event.issue.title, '[feed-settings]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate and apply settings
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python src/apply_issue_settings.py

      - name: Commit settings
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add promotion-rules.json
          if git diff --cached --quiet; then
            echo "Settings are already current."
          else
            git commit -m "Apply feed settings from issue #${ISSUE_NUMBER}"
            git push origin main
          fi

  deploy:
    needs: apply
    uses: ./.github/workflows/deploy-pages.yml
    secrets: inherit

  complete:
    needs: [apply, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm and close request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Настройки проверены и применены. Демонстрационный фид успешно пересобран."
          gh issue close "$ISSUE_NUMBER"

  report-failure:
    if: failure() && github.actor == github.repository_owner && startsWith(github.event.issue.title, '[feed-settings]')
    needs: [apply, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Report failure
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Настройки не применены: автоматическая проверка или сборка завершилась ошибкой. Запрос оставлен открытым для проверки."
