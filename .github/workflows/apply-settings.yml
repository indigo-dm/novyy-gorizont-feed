name: Apply feed settings

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  actions: write

jobs:
  apply:
    if: github.actor == github.repository_owner && startsWith(github.event.issue.title, '[feed-settings]')
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.settings.outputs.project }}
      mode: ${{ steps.settings.outputs.mode }}
      render_ids: ${{ steps.settings.outputs.render_ids }}
      settings_key: ${{ steps.settings-reference.outputs.storage_key }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Checkout current published inventory
        uses: actions/checkout@v7
        with:
          ref: feed-data
          path: .feed-data

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve referenced settings
        id: settings-reference
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python src/resolve_settings_reference.py

      - name: Download and verify referenced settings
        if: steps.settings-reference.outputs.storage_key != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: a9cba5f7aab40d0c2af7d11c14d59811
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: indigo-feed-studio
          STORAGE_KEY: ${{ steps.settings-reference.outputs.storage_key }}
          EXPECTED_SHA256: ${{ steps.settings-reference.outputs.expected_sha256 }}
        run: |
          aws s3 cp "s3://${R2_BUCKET}/${STORAGE_KEY}" .settings-request.json \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --only-show-errors
          python src/resolve_settings_reference.py \
            --verify-file .settings-request.json \
            --expected-sha256 "${EXPECTED_SHA256}"

      - name: Validate and apply settings
        id: settings
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          SETTINGS_JSON_FILE: ${{ steps.settings-reference.outputs.settings_file }}
          PUBLISHED_INVENTORY_ROOT: .feed-data/published
        run: python src/apply_issue_settings.py

      - name: Commit settings
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/*/promotion-rules.json projects/*/config.json
          if git diff --cached --quiet; then
            echo "Settings are already current."
          else
            git commit -m "Apply feed settings from issue #${ISSUE_NUMBER}"
            git push origin main
          fi

  fast-deploy:
    if: needs.apply.outputs.mode == 'fast'
    needs: apply
    uses: ./.github/workflows/build-fast-data.yml
    with:
      project: ${{ needs.apply.outputs.project }}
    secrets: inherit

  full-deploy:
    if: needs.apply.outputs.mode == 'full'
    needs: apply
    uses: ./.github/workflows/deploy-pages.yml
    with:
      project: ${{ needs.apply.outputs.project }}
      render_ids: ${{ needs.apply.outputs.render_ids }}
    secrets: inherit

  cleanup-uploads:
    if: always() && needs.apply.result == 'success' && (needs.fast-deploy.result == 'success' || needs.fast-deploy.result == 'skipped') && (needs.full-deploy.result == 'success' || needs.full-deploy.result == 'skipped')
    needs: [apply, fast-deploy, full-deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Delete uploaded images removed from the feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_MEDIA_BRANCH: media
        run: python src/cleanup_uploaded_images.py

  complete:
    if: always() && needs.cleanup-uploads.result == 'success'
    needs: [apply, cleanup-uploads]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm and close request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
          CLOUDFLARE_ACCOUNT_ID: a9cba5f7aab40d0c2af7d11c14d59811
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: indigo-feed-studio
          STORAGE_KEY: ${{ needs.apply.outputs.settings_key }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Настройки проверены и применены. Готовый фид успешно пересобран."
          gh issue close "$ISSUE_NUMBER"
          if [ -n "$STORAGE_KEY" ]; then
            aws s3 rm "s3://${R2_BUCKET}/${STORAGE_KEY}" \
              --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --only-show-errors
          fi

  report-failure:
    if: always() && github.actor == github.repository_owner && startsWith(github.event.issue.title, '[feed-settings]') && (needs.apply.result == 'failure' || needs.fast-deploy.result == 'failure' || needs.full-deploy.result == 'failure' || needs.cleanup-uploads.result == 'failure')
    needs: [apply, fast-deploy, full-deploy, cleanup-uploads]
    runs-on: ubuntu-latest
    steps:
      - name: Report failure
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Настройки не применены: автоматическая проверка или сборка завершилась ошибкой. Запрос оставлен открытым для проверки."
